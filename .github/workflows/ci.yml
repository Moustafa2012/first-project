name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Database tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 server binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - run: bash scripts/db-test.sh

  e2e:
    name: End-to-end (Playwright, local test backend)
    runs-on: ubuntu-24.04
    needs: [checks, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: PostgreSQL 16 server binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run e2e:backend
      - run: npm run e2e:app
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/shifa-e2e
          if-no-files-found: ignore
